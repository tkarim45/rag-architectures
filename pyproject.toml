[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-architectures"
version = "0.1.0"
description = "Many RAG architectures (naive/hybrid/rerank/HyDE/fusion/chunking/GraphRAG/RAPTOR/corrective/adaptive/agentic) over one corpus, benchmarked on retrieval recall + answer correctness. Real embeddings + Claude on AWS Bedrock"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Taimour Abdul Karim", email = "taimour.a.karim@gmail.com" }]
keywords = ["rag", "retrieval-augmented-generation", "graphrag", "raptor", "agentic-rag", "llm", "bedrock", "embeddings"]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "sentence-transformers>=2.2",
  "rank-bm25>=0.2.2",
  "faiss-cpu>=1.7",
  "networkx>=3.0",
  "anthropic[bedrock]>=0.40",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rag-bench = "cli:main"

[tool.hatch.build.targets.wheel]
# flat layout: shared framework in core/, one top-level package per RAG architecture
packages = ["core", "naive", "sparse", "hybrid", "rerank", "multi_query", "rag_fusion",
            "hyde", "chunking", "graphrag", "raptor", "corrective", "adaptive", "agentic"]

[tool.hatch.build.targets.wheel.force-include]
"benchmark.py" = "benchmark.py"
"cli.py" = "cli.py"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
